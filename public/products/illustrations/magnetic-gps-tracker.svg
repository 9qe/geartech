<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0E1014"/><stop offset="100%" stop-color="#060709"/></linearGradient></defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <g transform="translate(200,140)">
    <!-- magnetic base -->
    <rect x="-55" y="15" width="110" height="22" rx="6" fill="#0b0e14" stroke="rgba(255,255,255,0.12)"/>
    <rect x="-50" y="18" width="100" height="16" rx="4" fill="#14B8A6" opacity="0.12"/>
    <!-- top shell -->
    <rect x="-50" y="-25" width="100" height="42" rx="8" fill="#1a1f2b" stroke="rgba(255,255,255,0.12)"/>
    <!-- antenna / status -->
    <circle cx="35" cy="-10" r="3" fill="#14B8A6"/>
    <circle cx="35" cy="-10" r="7" fill="none" stroke="#14B8A6" stroke-width="1" opacity="0.4"/>
    <!-- magnet poles -->
    <rect x="-45" y="20" width="8" height="8" rx="2" fill="#FF2A54" opacity="0.6"/>
    <rect x="37" y="20" width="8" height="8" rx="2" fill="#14B8A6" opacity="0.6"/>
    <!-- location pin icon -->
    <g transform="translate(0,-45)">
      <path d="M0 -12 C-8 -12 -12 -6 -12 0 C-12 8 0 18 0 18 C0 18 12 8 12 0 C12 -6 8 -12 0 -12 Z" fill="#14B8A6" opacity="0.85"/>
      <circle cx="0" cy="-2" r="3" fill="#060709"/>
    </g>
  </g>
  </svg>
