<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0E1014"/><stop offset="100%" stop-color="#060709"/></linearGradient></defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- RC drift car -->
  <g transform="translate(200,160)">
    <ellipse cx="0" cy="40" rx="110" ry="12" fill="rgba(0,0,0,0.5)"/>
    <!-- body -->
    <path d="M-95 20 L-70 -10 L-20 -22 L40 -22 L75 -5 L95 15 L95 30 L-95 30 Z" fill="#1a1f2b" stroke="rgba(255,255,255,0.12)"/>
    <path d="M-55 -10 L-20 -20 L40 -20 L60 -8 L60 0 L-55 0 Z" fill="#14B8A6" opacity="0.15"/>
    <!-- windows -->
    <path d="M-15 -18 L35 -18 L55 -8 L55 0 L-15 0 Z" fill="#0b0e14" opacity="0.8"/>
    <!-- wheels -->
    <circle cx="-60" cy="32" r="18" fill="#0b0e14" stroke="#14B8A6" stroke-width="2"/>
    <circle cx="-60" cy="32" r="8" fill="#1a1f2b"/>
    <circle cx="60" cy="32" r="18" fill="#0b0e14" stroke="#14B8A6" stroke-width="2"/>
    <circle cx="60" cy="32" r="8" fill="#1a1f2b"/>
    <!-- headlights -->
    <rect x="88" y="12" width="6" height="4" rx="1" fill="#14B8A6"/>
    <rect x="88" y="20" width="6" height="4" rx="1" fill="#14B8A6"/>
    <!-- rear smoke -->
    <circle cx="-105" cy="20" r="6" fill="#94A3B8" opacity="0.3"/>
    <circle cx="-118" cy="14" r="8" fill="#94A3B8" opacity="0.2"/>
  </g>
  <text x="200" y="270" text-anchor="middle" font-family="Inter, system-ui" font-size="11" fill="#94A3B8" letter-spacing="2">PRO DRIFT RC CAR 1:16</text>
</svg>
