<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0E1014"/><stop offset="100%" stop-color="#060709"/></linearGradient></defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <g transform="translate(200,150)">
    <!-- charger body -->
    <rect x="-55" y="-22" width="110" height="44" rx="10" fill="#1a1f2b" stroke="rgba(255,255,255,0.12)"/>
    <!-- swivel plug -->
    <rect x="-70" y="-12" width="18" height="24" rx="4" fill="#0b0e14" stroke="rgba(255,255,255,0.12)"/>
    <rect x="-78" y="-6" width="10" height="12" rx="2" fill="#14B8A6" opacity="0.6"/>
    <!-- cable spool -->
    <circle cx="25" cy="0" r="14" fill="#0b0e14" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="25" cy="0" r="8" fill="#1a1f2b"/>
    <!-- retractable cable -->
    <path d="M39 0 Q70 0 90 -10 Q110 -20 100 -35" stroke="#14B8A6" stroke-width="2" fill="none" opacity="0.7"/>
    <rect x="95" y="-42" width="10" height="6" rx="2" fill="#14B8A6" opacity="0.6"/>
    <rect x="95" y="-30" width="10" height="6" rx="2" fill="#94A3B8" opacity="0.4"/>
    <!-- LED -->
    <circle cx="-30" cy="0" r="3" fill="#14B8A6"/>
    <!-- ports labels -->
    <text x="-10" y="4" text-anchor="middle" font-family="Inter, system-ui" font-size="8" fill="#94A3B8">USB-C</text>
    <text x="25" y="-30" text-anchor="middle" font-family="Inter, system-ui" font-size="8" fill="#94A3B8">30W</text>
  </g>
  <text x="200" y="260" text-anchor="middle" font-family="Inter, system-ui" font-size="11" fill="#94A3B8" letter-spacing="2">RETRACTABLE 4-IN-1 CHARGER</text>
</svg>
