<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0E1014"/><stop offset="100%" stop-color="#060709"/></linearGradient></defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <g transform="translate(200,150)">
    <!-- body -->
    <rect x="-70" y="-25" width="140" height="50" rx="12" fill="#1a1f2b" stroke="rgba(255,255,255,0.12)"/>
    <!-- handle -->
    <path d="M-20 -25 L-20 -55 Q-20 -65 0 -65 Q20 -65 20 -55 L20 -25" fill="none" stroke="#1a1f2b" stroke-width="10" stroke-linecap="round"/>
    <path d="M-20 -25 L-20 -55 Q-20 -65 0 -65 Q20 -65 20 -55 L20 -25" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <!-- nozzle -->
    <rect x="70" y="-12" width="50" height="24" rx="6" fill="#0b0e14" stroke="rgba(255,255,255,0.12)"/>
    <rect x="118" y="-8" width="12" height="16" rx="3" fill="#14B8A6" opacity="0.6"/>
    <!-- vent slots -->
    <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
      <line x1="-50" y1="-15" x2="-50" y2="15"/><line x1="-35" y1="-15" x2="-35" y2="15"/>
      <line x1="-20" y1="-15" x2="-20" y2="15"/><line x1="-5" y1="-15" x2="-5" y2="15"/>
    </g>
    <!-- LED indicator -->
    <circle cx="0" cy="0" r="4" fill="#14B8A6"/>
    <!-- HEPA filter hint -->
    <rect x="-68" y="-23" width="20" height="46" rx="4" fill="#14B8A6" opacity="0.08"/>
  </g>
  </svg>
