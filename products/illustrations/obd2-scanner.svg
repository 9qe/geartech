<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0E1014"/><stop offset="100%" stop-color="#060709"/></linearGradient></defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <g transform="translate(200,145)">
    <!-- main dongle body -->
    <rect x="-45" y="-28" width="90" height="56" rx="10" fill="#1a1f2b" stroke="rgba(255,255,255,0.12)"/>
    <!-- OBD connector (16-pin trapezoid) -->
    <path d="M-38 28 L-30 46 L30 46 L38 28 Z" fill="#0b0e14" stroke="rgba(255,255,255,0.12)"/>
    <g fill="#14B8A6" opacity="0.5">
      <circle cx="-22" cy="38" r="2"/><circle cx="-10" cy="38" r="2"/><circle cx="2" cy="38" r="2"/><circle cx="14" cy="38" r="2"/><circle cx="26" cy="38" r="2"/>
    </g>
    <!-- status LED -->
    <circle cx="28" cy="-12" r="4" fill="#14B8A6"/>
    <circle cx="28" cy="-12" r="8" fill="none" stroke="#14B8A6" stroke-width="1" opacity="0.35"/>
    <!-- bluetooth icon -->
    <g transform="translate(-20,-8)" stroke="#94A3B8" stroke-width="1.5" fill="none">
      <path d="M0 -10 L6 -4 L0 2 L6 8 L0 14"/><line x1="-6" y1="-4" x2="6" y2="2"/><line x1="-6" y1="8" x2="6" y2="2"/>
    </g>
    <!-- brand mark -->
    </g>
  </svg>
